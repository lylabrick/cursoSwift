name: ListaLibrosLectura
options:
  bundleIdPrefix: com.lylabrick
  
targets:
  ListaLibrosLectura:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/ListaLibrosLectura
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lylabrick.ListaLibrosLectura
      SWIFT_VERSION: "6.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      
  ListaLibrosLecturaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/ListaLibrosLecturaTests
    dependencies:
      - target: ListaLibrosLectura
